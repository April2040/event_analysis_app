name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 代码检查和测试
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests beautifulsoup4 lxml jieba python-dateutil
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: 代码风格检查
      run: |
        pip install flake8
        # 停止构建如果有Python语法错误或未定义的名称
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 退出时将所有错误视为警告
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 项目结构验证
      run: |
        echo "检查关键文件..."
        test -f main_integrated.py && echo "✅ main_integrated.py 存在"
        test -f standardized_renderer.py && echo "✅ standardized_renderer.py 存在"
        test -d modules/news_analysis && echo "✅ news_analysis 模块存在"
        test -d modules/news_crawler && echo "✅ news_crawler 模块存在"
    
    - name: 模块导入测试
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from modules.news_analysis import analyzer; print('✅ news_analysis 模块导入成功')"
        python -c "import sys; sys.path.insert(0, '.'); from modules.news_crawler import crawler; print('✅ news_crawler 模块导入成功')"
