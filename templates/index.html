<!DOCTYPE html>
<html>
<head>
    <title>事件分析 · DeepSeek</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 40px; max-width: 800px; }
        textarea { width: 100%; height: 100px; font-size: 16px; padding: 10px; border: 2px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        pre { background: #f8f8f8; padding: 20px; white-space: pre-wrap; border-radius: 5px; border: 1px solid #ddd; }
        .loading { color: #007bff; font-weight: bold; }
        .form-container { margin-bottom: 20px; }
    </style>
    <script>
        function showLoading() {
            const button = document.getElementById('submit-btn');
            const loadingDiv = document.getElementById('loading');
            button.disabled = true;
            button.textContent = '分析中...';
            loadingDiv.style.display = 'block';
        }
    </script>
</head>
<body>
    <h1>🧠 热点事件分析器</h1>
    
    <div class="form-container">
        <form method="post" onsubmit="showLoading()">
            <label>输入一个热点事件描述：</label><br><br>
            <textarea name="user_input" placeholder="例如：美联储加息对全球股市的影响..." required></textarea><br><br>
            <button type="submit" id="submit-btn">🔍 开始分析</button>
        </form>
    </div>
    
    <div id="loading" style="display: none;" class="loading">
        ⏳ 正在分析中，请稍候...（AI正在思考，通常需要10-30秒）
    </div>

    {% if result %}
        <hr>
        <h2>🔍 分析结果：</h2>
        <pre>{{ result }}</pre>
    {% endif %}
</body>
</html>
