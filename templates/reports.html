<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>历史报告 - 事件分析器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .content {
            padding: 40px;
        }
        
        .back-link {
            margin-bottom: 30px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .report-list {
            list-style: none;
        }
        
        .report-item {
            background: #f8f9fa;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .report-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .report-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .report-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #333;
        }
        
        .report-time {
            color: #666;
            font-size: 0.9em;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
    <script>
        async function loadReports() {
            try {
                const response = await fetch('/reports');
                const data = await response.json();
                
                const container = document.getElementById('reports-container');
                
                if (data.reports && data.reports.length > 0) {
                    const reportsList = document.createElement('ul');
                    reportsList.className = 'report-list';
                    
                    data.reports.forEach(report => {
                        const li = document.createElement('li');
                        li.className = 'report-item';
                        
                        const timestamp = report.timestamp;
                        const formattedTime = `${timestamp.substring(0,4)}-${timestamp.substring(4,6)}-${timestamp.substring(6,8)} ${timestamp.substring(9,11)}:${timestamp.substring(11,13)}:${timestamp.substring(13,15)}`;
                        
                        li.innerHTML = `
                            <a href="${report.url}" class="report-link" target="_blank">
                                <div class="report-title">📊 分析报告</div>
                                <div class="report-time">生成时间: ${formattedTime}</div>
                            </a>
                        `;
                        
                        reportsList.appendChild(li);
                    });
                    
                    container.appendChild(reportsList);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>暂无报告</h3>
                            <p>还没有生成任何分析报告</p>
                            <p style="margin-top: 15px;">
                                <a href="/" style="color: #667eea; text-decoration: none;">← 返回首页开始分析</a>
                            </p>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('reports-container').innerHTML = `
                    <div class="empty-state">
                        <h3>加载失败</h3>
                        <p>无法加载报告列表: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 历史分析报告</h1>
            <p>查看所有生成的专业分析报告</p>
        </div>
        
        <div class="content">
            <div class="back-link">
                <a href="/">← 返回首页</a>
            </div>
            
            <div id="reports-container" class="loading">
                <div>⏳ 正在加载报告列表...</div>
            </div>
        </div>
    </div>
</body>
</html>
