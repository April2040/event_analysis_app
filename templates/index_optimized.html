<!DOCTYPE html>
<html>
<head>
    <title>事件分析 · DeepSeek</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
        }
        
        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 复选框样式 */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 1rem 0;
            cursor: pointer;
            font-size: 0.95rem;
            color: #555;
            padding: 0.75rem;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }
        
        .checkbox-container:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        .checkbox-container input[type="checkbox"] {
            margin-right: 0.75rem;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1rem;
            margin: 2rem 0;
        }
        
        .result-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
        }
        
        /* 侧边栏样式 */
        .sidebar {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 2rem;
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .sidebar-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }
        
        .news-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .news-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .news-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        .news-meta {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .news-summary {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.4;
        }
        
        .news-summary small {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.3;
            border-top: 1px solid #f0f0f0;
            padding-top: 8px;
            margin-top: 8px;
            display: block;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: #5a67d8;
        }
        
        .source-link {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
            margin-left: 8px;
        }

        .source-link:hover {
            background: #218838;
            color: white;
            text-decoration: none;
        }

        .news-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-news {
            text-align: center;
            padding: 2rem;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">📰 热点财经新闻</div>
            <button class="close-btn" onclick="closeSidebar()">&times;</button>
        </div>
        <div id="news-content">
            <div class="loading-news">
                <div>📊 正在获取最新财经新闻...</div>
                <div style="margin-top: 1rem; font-size: 0.9rem; color: #999;">请稍候片刻</div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="form-container">
            <h1>🧠 智能事件分析器</h1>
            
            <form method="post" id="analysisForm">
                <div class="form-group">
                    <label for="user_input">📝 请输入您要分析的热点事件或新闻标题：</label>
                    <textarea 
                        name="user_input" 
                        id="user_input" 
                        rows="4" 
                        placeholder="请输入热点事件或新闻标题，例如：&#10;• 美联储加息政策对全球股市的影响&#10;• 比特币价格波动分析&#10;• 新能源汽车行业发展趋势&#10;&#10;如需参考热点新闻，可点击右侧"获取新闻"按钮"
                        required
                    ></textarea>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" name="fast_mode" value="true" id="fastMode">
                        <span class="checkmark"></span>
                        ⚡ 快速模式 (仅生成分析结果，跳过HTML报告，节省50%时间)
                    </label>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        🔍 开始分析
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="openNewsSidebar()">
                        📰 获取新闻
                    </button>
                </div>
            </form>
            
            <div id="loading" class="loading" style="display: none;">
                <div>🤖 AI正在分析中...</div>
                <div style="margin-top: 0.5rem; font-size: 0.9rem;">第一步：事件分析 → 第二步：生成专业报告</div>
                <div style="margin-top: 0.5rem; font-size: 0.8rem; color: #999;">通常需要30-60秒，请耐心等待</div>
            </div>
        </div>
        
        {% if result %}
        <div class="result-container">
            {{ result }}
        </div>
        {% endif %}
    </div>

    <script>
        // 表单提交处理
        document.getElementById('analysisForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const fastMode = document.getElementById('fastMode').checked;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '🔄 分析中...';
            loading.style.display = 'block';
            
            // 根据快速模式更新加载信息
            if (fastMode) {
                loading.innerHTML = `
                    <div>⚡ 快速模式：AI正在分析中...</div>
                    <div style="margin-top: 0.5rem; font-size: 0.9rem;">仅生成分析结果，跳过HTML生成</div>
                    <div style="margin-top: 0.5rem; font-size: 0.8rem; color: #999;">预计需要15-30秒</div>
                `;
            } else {
                loading.innerHTML = `
                    <div>🤖 AI正在分析中...</div>
                    <div style="margin-top: 0.5rem; font-size: 0.9rem;">第一步：事件分析 → 第二步：生成专业报告</div>
                    <div style="margin-top: 0.5rem; font-size: 0.8rem; color: #999;">通常需要30-60秒，请耐心等待</div>
                `;
            }
        });
        
        // 打开新闻侧边栏
        function openNewsSidebar() {
            document.getElementById('overlay').classList.add('show');
            document.getElementById('sidebar').classList.add('open');
            loadNews();
        }
        
        // 关闭侧边栏
        function closeSidebar() {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('sidebar').classList.remove('open');
        }
        
        // 加载新闻数据
        async function loadNews() {
            try {
                const response = await fetch('/api/news');
                const data = await response.json();
                
                if (data.success && data.news && data.news.length > 0) {
                    displayNews(data.news);
                } else {
                    document.getElementById('news-content').innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: #666;">
                            <div>📰 暂无新闻数据</div>
                            <div style="margin-top: 0.5rem; font-size: 0.9rem;">请稍后重试</div>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('news-content').innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: #e74c3c;">
                        <div>❌ 获取新闻失败</div>
                        <div style="margin-top: 0.5rem; font-size: 0.9rem;">${error.message}</div>
                    </div>
                `;
            }
        }
        
        // 显示新闻列表
        function displayNews(newsList) {
            const newsContent = newsList.map((news, index) => `
                <div class="news-item" onclick="selectNews(${index})">
                    <div class="news-title">${news.title || '无标题'}</div>
                    <div class="news-meta">
                        📊 ${news.category || '财经'} | 🔥 热度: ${(news.heat_score || 0).toFixed(1)} | 📅 ${news.source || '未知来源'}
                    </div>
                    <div class="news-summary">
                        📰 ${news.summary || news.description || '暂无摘要'}
                        <small>
                            🕐 发布时间: ${news.published || '未知时间'} | 📍 信息源: ${news.source || '未知来源'}
                        </small>
                    </div>
                    <div class="news-actions">
                        <button class="copy-btn" onclick="copyNewsText(${index}, event)">📝 复制新闻</button>
                        <a href="${news.link || '#'}" target="_blank" class="source-link" onclick="event.stopPropagation()">
                            🔗 查看原文
                        </a>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('news-content').innerHTML = newsContent;
            
            // 保存新闻数据供复制使用
            window.newsData = newsList;
        }
        
        // 复制新闻到输入框
        function copyNewsText(index, event) {
            event.stopPropagation();
            const news = window.newsData[index];
            
            // 构建完整的新闻信息
            const newsTitle = news.title || '无标题';
            const newsTime = news.published || '未知时间';
            const newsSummary = news.summary || '暂无概述';
            const newsSource = news.source || '未知来源';
            
            // 整合新闻信息为提示词格式
            const fullNewsContent = `新闻标题：${newsTitle}
发布时间：${newsTime}
信息来源：${newsSource}
新闻概述：${newsSummary}

请分析这条财经新闻的影响和意义。`;
            
            document.getElementById('user_input').value = fullNewsContent;
            closeSidebar();
            
            // 滚动到输入框
            document.getElementById('user_input').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('user_input').focus();
            
            // 显示成功提示
            showCopySuccess();
        }
        
        // 选择新闻（点击整个卡片）
        function selectNews(index) {
            copyNewsText(index, { stopPropagation: () => {} });
        }
        
        // 显示复制成功提示
        function showCopySuccess() {
            const btn = document.querySelector('#submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '✅ 新闻标题已导入';
            btn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }, 2000);
        }
    </script>
</body>
</html>
